<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADPLANET SN</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <button onclick="alert('Le JavaScript fonctionne !')" style="position:fixed; top:10px; right:10px; z-index:9999; padding:5px; opacity:0.3;">Test JS</button>

    <section id="view-landing" class="view active">
        <div class="hero">
            <h1>ADPLANET <span>SN</span></h1>
            <p>Défilez pour découvrir la plateforme</p>
            <div style="height: 100vh;"></div> <button class="btn btn-primary" onclick="showView('view-auth')">Commencer</button>
        </div>
    </section>

    <section id="view-auth" class="view">
        <div class="auth-box">
            <h2 id="auth-title">Connexion</h2>
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-pw" placeholder="Mot de passe">
            <button class="btn btn-primary" id="btn-auth-submit">Valider</button>
            <p onclick="toggleAuthMode()" id="auth-toggle-text" style="cursor:pointer; color:blue; margin-top:10px;">S'inscrire</p>
        </div>
    </section>

    <section id="view-home" class="view">
        <nav class="main-nav">
            <span>ADPLANET</span>
            <button onclick="showView('view-profile')">👤 Profil</button>
        </nav>
        <div class="content">
            <h2>Fil d'actualité</h2>
            <div id="feed"></div>
        </div>
    </section>

    <section id="view-profile" class="view">
        <nav class="main-nav">
            <button onclick="showView('view-home')">← Retour</button>
            <button onclick="handleLogout()">Quitter</button>
        </nav>
        <div class="content">
            <h2>Mon Espace</h2>
            <button class="btn btn-primary" onclick="openPublishModal()">+ Publier</button>
            <div id="my-ads"></div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
