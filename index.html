<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADPLANET SN — Publicité Gratuite au Sénégal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Exo+2:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff; --surface: #f4f6fb; --border: #d8dff0;
            --accent: #0055ff; --accent2: #00c8ff; --dark: #08091a;
            --text: #0d1225; --text2: #4a5070; --success: #25D366; --error: #ff3d71;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Exo 2', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        
        #navbar { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
        .nav-logo { font-family: 'Orbitron'; font-weight: 900; font-size: 20px; text-decoration: none; color: var(--dark); }
        .nav-logo span { color: var(--accent); }
        .btn { padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: white; }
        
        #hero { padding: 120px 20px 60px; text-align: center; background: radial-gradient(circle at top right, rgba(0,85,255,0.05), transparent); }
        .hero-title { font-family: 'Orbitron'; font-size: 2.5rem; margin-bottom: 20px; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .ads-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        
        .ad-card { background: white; border: 1px solid var(--border); border-radius: 15px; overflow: hidden; transition: 0.3s; cursor: pointer; }
        .ad-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .ad-img-placeholder { height: 150px; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 50px; }
        .ad-body { padding: 15px; }
        .ad-price { color: var(--accent); font-weight: 800; font-size: 1.1rem; }

        .btn-whatsapp { background: var(--success); color: white; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 15px; border-radius: 10px; font-weight: 700; margin-top: 15px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal.open { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 20px; }
        
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; }
    </style>
</head>
<body>

<nav id="navbar">
    <a href="#" class="nav-logo" onclick="location.reload()">AD<span>PLANET</span></a>
    <div id="nav-actions">
        <button class="btn btn-primary" onclick="openModal('auth-modal')">Se Connecter</button>
    </div>
</nav>

<section id="hero">
    <h1 class="hero-title">Vendez tout au <span>Sénégal</span></h1>
    <p>La publicité 100% gratuite. Zéro commission. Contact direct via WhatsApp.</p>
    <div style="margin-top: 30px;">
        <button class="btn btn-primary" onclick="openModal('post-ad-modal')">+ Publier une annonce</button>
    </div>
</section>

<div class="container" id="main-content">
    <div class="ads-grid" id="ads-grid">
        <p>Chargement des annonces...</p>
    </div>
</div>

<div class="modal" id="auth-modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('auth-modal')">×</span>
        <h2 id="auth-title">Connexion</h2>
        <div id="auth-form" style="margin-top: 20px;">
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-pw" placeholder="Mot de passe">
            <button class="btn btn-primary" style="width: 100%" onclick="handleAuth()">Continuer</button>
            <p style="text-align: center; margin-top: 15px; font-size: 13px; cursor: pointer; color: var(--accent);" onclick="toggleAuthMode()">Pas de compte ? S'inscrire</p>
        </div>
    </div>
</div>

<div class="modal" id="post-ad-modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('post-ad-modal')">×</span>
        <h2>Nouvelle Annonce</h2>
        <input type="text" id="ad-title" placeholder="Titre (ex: iPhone 15 Pro Max)">
        <select id="ad-category">
            <option value="produits">Produits / Vente</option>
            <option value="services">Services / Prestations</option>
            <option value="immobilier">Immobilier</option>
            <option value="auto">Véhicules</option>
        </select>
        <textarea id="ad-desc" placeholder="Description détaillée..."></textarea>
        <input type="text" id="ad-price" placeholder="Prix (ex: 500 000)">
        <div style="display:flex; gap:5px; align-items: center; margin-bottom: 15px;">
            <span style="background: #eee; padding: 12px; border-radius: 8px;">+221</span>
            <input type="tel" id="ad-contact" placeholder="Numéro WhatsApp (77xxxxxxx)" style="margin-bottom:0">
        </div>
        <input type="text" id="ad-location" placeholder="Ville (ex: Dakar, Saly...)">
        <button class="btn btn-primary" style="width:100%" onclick="postAd()">PUBLIER MAINTENANT</button>
    </div>
</div>

<div class="modal" id="view-ad-modal">
    <div class="modal-content" id="view-ad-body"></div>
</div>

<script>
// CONFIGURATION DIRECTE
const SB_URL = "https://hygkieeuiwgyvvqxyjmv.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5Z2tpZWV1aXdneXZ2cXh5am12Iiwicm9sZSI6Imh5Z2tpZWV1aXdneXZ2cXh5am12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MTIyNDAsImV4cCI6MjA5MzM4ODI0MH0.NNP6q_OmIVfXLt-lIPBNY1HiGdw5gLlI2ZbwdNCMP_Y";

const supabase = window.supabase.createClient(SB_URL, SB_KEY);
let currentUser = null;
let isSignUp = false;

window.onload = () => {
    checkUser();
    loadAds();
};

async function checkUser() {
    const { data: { session } } = await supabase.auth.getSession();
    if(session) {
        currentUser = session.user;
        document.getElementById('nav-actions').innerHTML = `
            <span style="margin-right:15px; font-weight:bold;">${currentUser.email.split('@')[0]}</span>
            <button class="btn" onclick="supabase.auth.signOut().then(() => location.reload())">Déconnexion</button>
        `;
    }
}

async function handleAuth() {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-pw').value;
    const { data, error } = isSignUp 
        ? await supabase.auth.signUp({ email, password })
        : await supabase.auth.signInWithPassword({ email, password });

    if(error) alert(error.message);
    else {
        alert(isSignUp ? "Vérifiez votre email !" : "Connecté !");
        location.reload();
    }
}

function toggleAuthMode() {
    isSignUp = !isSignUp;
    document.getElementById('auth-title').innerText = isSignUp ? "Inscription" : "Connexion";
}

async function postAd() {
    if(!currentUser) return openModal('auth-modal');
    const adData = {
        user_id: currentUser.id,
        title: document.getElementById('ad-title').value,
        category: document.getElementById('ad-category').value,
        description: document.getElementById('ad-desc').value,
        price: document.getElementById('ad-price').value,
        contact: document.getElementById('ad-contact').value.replace(/\s/g, ''),
        location: document.getElementById('ad-location').value,
        active: true
    };
    const { error } = await supabase.from('ads').insert([adData]);
    if(error) alert(error.message);
    else { alert("Annonce publiée !"); closeModal('post-ad-modal'); loadAds(); }
}

async function loadAds() {
    const { data, error } = await supabase.from('ads').select('*').order('created_at', {ascending: false});
    const grid = document.getElementById('ads-grid');
    grid.innerHTML = '';
    if(data && data.length > 0) {
        data.forEach(ad => {
            const card = document.createElement('div');
            card.className = 'ad-card';
            card.onclick = () => viewAd(ad);
            card.innerHTML = `
                <div class="ad-img-placeholder">📦</div>
                <div class="ad-body">
                    <h3 style="font-size:16px; margin-bottom:5px;">${ad.title}</h3>
                    <p class="ad-price">${ad.price} FCFA</p>
                    <p style="font-size:12px; color:gray;">📍 ${ad.location || 'Sénégal'}</p>
                </div>`;
            grid.appendChild(card);
        });
    } else {
        grid.innerHTML = '<p>Aucune annonce pour le moment.</p>';
    }
}

function viewAd(ad) {
    const waLink = `https://wa.me/221${ad.contact}?text=Bonjour, je vous contacte pour l'annonce : ${encodeURIComponent(ad.title)}`;
    document.getElementById('view-ad-body').innerHTML = `
        <span class="close-modal" onclick="closeModal('view-ad-modal')">×</span>
        <h2 style="font-family:Orbitron;">${ad.title}</h2>
        <p style="color:var(--accent); font-weight:800; font-size:24px; margin:15px 0;">${ad.price} FCFA</p>
        <p style="margin-bottom:20px; color:var(--text2);">${ad.description}</p>
        <p><strong>📍 Localisation:</strong> ${ad.location}</p>
        <a href="${waLink}" target="_blank" class="btn-whatsapp">💬 CONTACTER VIA WHATSAPP</a>`;
    openModal('view-ad-modal');
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
</script>
</body>

<script>
let supabase = null;
let isSignUp = false;
let currentUser = null;

function initSupabase() {
    const url = document.getElementById('sb-url').value;
    const key = document.getElementById('sb-key').value;
    if(!url || !key) return alert("Clés manquantes");
    
    supabase = window.supabase.createClient(url, key);
    localStorage.setItem('sn_url', url); localStorage.setItem('sn_key', key);
    document.getElementById('config-overlay').style.display = 'none';
    checkUser();
    loadAds();
}

window.onload = () => {
    const u = localStorage.getItem('sn_url'), k = localStorage.getItem('sn_key');
    if(u && k) {
        document.getElementById('sb-url').value = u;
        document.getElementById('sb-key').value = k;
    }
};

async function checkUser() {

}

async function postAd() {

        price: document.getElementById('ad-price').value,

        location: document.getElementById('ad-location').value,
        active: true

        loadAds();
    }
}

}

function viewAd(ad) {

            CONTACER VIA WHATSAPP

    `;

}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
</script>
